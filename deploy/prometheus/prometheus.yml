global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # DNS discovery finds every scaled replica of `api` and `aggregator`.
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
  - job_name: aggregator
    dns_sd_configs:
      - names: [aggregator]
        type: A
        port: 9100
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
