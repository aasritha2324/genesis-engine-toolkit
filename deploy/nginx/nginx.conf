worker_processes auto;
events { worker_connections 4096; }

http {
  # Docker's embedded DNS. Re-resolving `api` every 5s picks up scaled replicas
  # (docker compose up --scale api=3) and drops dead ones.
  resolver 127.0.0.11 valid=5s ipv6=off;

  log_format lb '$remote_addr "$request" $status upstream=$upstream_addr served_by=$upstream_http_x_served_by rt=$request_time';
  access_log /dev/stdout lb;

  client_max_body_size 512k;

  server {
    listen 80;

    set $api_upstream http://api:8000;
    set $frontend_upstream http://frontend:80;

    location = /nginx-health { return 200 "ok\n"; }

    location ~ ^/(clicks|auth|api|health|ready)(/|$) {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      # If a replica dies, retry the request on the next one.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 3;
      # X-Served-By is set by each API replica; also expose the upstream address.
      add_header X-Upstream-Addr $upstream_addr always;
      add_header Access-Control-Expose-Headers "X-Served-By, X-Upstream-Addr" always;
    }

    # Per-replica metrics are scraped by Prometheus directly, never through the LB.
    location = /metrics { return 404; }

    location / {
      proxy_pass $frontend_upstream;
    }
  }
}
